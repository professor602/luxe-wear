<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Manage your LuxeWear demo profile and view your orders.">
  <title>My Profile – LuxeWear</title>

  <script>document.documentElement.classList.add('js');</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body data-page="profile">

  <div id="site-header"></div>

  <main id="main-content">

    <section class="page-banner">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a> / <span>My Profile</span>
        </nav>
        <h1>My Profile</h1>
        <p>Manage your demo account details and view your orders.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">

        <!-- Hidden until profile.js confirms the visitor is logged in -->
        <div class="profile-layout hidden" id="profile-root">

          <aside class="profile-card">
            <div class="profile-avatar" id="profile-avatar" aria-hidden="true">?</div>
            <h3 id="profile-name"></h3>
            <p id="profile-email"></p>
            <p id="profile-joined"></p>
            <p id="profile-orders-count"></p>
            <button type="button" class="btn btn-outline btn-block" id="logout-btn">
              <i class="fa-solid fa-right-from-bracket"></i> Log Out
            </button>
          </aside>

          <div>
            <div class="alert alert-warning" role="note">
              <strong>Demo only.</strong> Profile details are saved in this browser's LocalStorage without
              protection. Please use made-up information only.
            </div>

            <section class="panel">
              <h3>Edit Profile</h3>
              <form id="profile-form" novalidate>
                <div class="form-group">
                  <label for="profile-name-input">Full name</label>
                  <input type="text" id="profile-name-input" class="form-control" maxlength="60" autocomplete="name">
                  <span class="form-error"></span>
                </div>

                <div class="form-group">
                  <label for="profile-email-input">Email address</label>
                  <input type="email" id="profile-email-input" class="form-control" disabled>
                  <small style="color: var(--grey);">Email cannot be changed in this demo.</small>
                </div>

                <div class="form-row">
                  <div class="form-group">
                    <label for="profile-phone">Phone (optional)</label>
                    <input type="tel" id="profile-phone" class="form-control" placeholder="e.g. +1 555 010 0000" maxlength="20" autocomplete="tel">
                    <span class="form-error"></span>
                  </div>
                  <div class="form-group">
                    <label for="profile-city">City (optional)</label>
                    <input type="text" id="profile-city" class="form-control" maxlength="60" autocomplete="address-level2">
                    <span class="form-error"></span>
                  </div>
                </div>

                <div class="form-group">
                  <label for="profile-address">Address (optional)</label>
                  <input type="text" id="profile-address" class="form-control" placeholder="Demo address only" maxlength="120" autocomplete="street-address">
                  <span class="form-error"></span>
                </div>

                <button type="submit" class="btn btn-primary">Save Changes</button>
              </form>
            </section>

            <section class="panel">
              <h3>Order History</h3>
              <div id="orders-list"></div>
            </section>
          </div>

        </div>

      </div>
    </section>

  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/profile.js"></script>
  <script src="assets/js/animations.js"></script>
</body>
</html>
